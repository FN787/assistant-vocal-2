name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onedir --windowed --name AssistantVocal --collect-all faster_whisper --collect-all ctranslate2 assistant_vocal.py
      - uses: actions/upload-artifact@v4
        with:
          name: AssistantVocal-windows
          path: dist/AssistantVocal
